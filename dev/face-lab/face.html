<!doctype html><meta charset=utf-8><body style="background:#ddd;margin:0;font:12px monospace"><div id=out style="display:flex;flex-wrap:wrap;gap:6px"></div>
<script type=module>
import {preloadFace,analyzePhoto} from '../../public/js/face.js';
import {getSprite,drawPreview} from '../../public/js/avatar.js';
const faceapi=await preloadFace();
const out=document.getElementById('out'); const results=[];
for(let i=1;i<=6;i++){
  const img=new Image(); img.src=`sample${i}.jpg`; await img.decode();
  const dets=await faceapi.detectAllFaces(img,new faceapi.TinyFaceDetectorOptions({inputSize:608,scoreThreshold:0.4})).withFaceLandmarks();
  for(const d of dets){
    const P=d.landmarks.positions; const fw=P[16].x-P[0].x; const side=fw/0.4;
    const fcx=(P[0].x+P[16].x)/2, browY=Math.min(...P.slice(17,27).map(p=>p.y)), fcy=(browY+P[8].y)/2;
    const c=document.createElement('canvas'); c.width=c.height=360; const g=c.getContext('2d');
    g.drawImage(img,fcx-side/2,fcy-side*0.42,side,side,0,0,360,360);
    const r=await analyzePhoto(c,{debugMask:true}); if(r.mask){const g2=c.getContext('2d'); g2.drawImage(r.mask,0,0);}
    const box=document.createElement('div'); box.style.cssText='background:#fff;padding:4px;width:300px';
    c.style.width='150px'; box.append(c);
    const av=document.createElement('canvas'); av.width=110; av.height=170; av.style.imageRendering='pixelated';
    if(r.ok){ drawPreview(av,{color:1,outfit:'casual',...r.patch}); }
    box.append(av);
    const t=document.createElement('div'); t.textContent=r.ok? r.tags.map(x=>x.ko).join(', ')+' | '+JSON.stringify(r.patch.hp)+' '+r.patch.eyes+'/'+r.patch.mouth+'/'+r.patch.beard+'/'+r.patch.glasses+'/'+r.patch.outfit+' '+Object.entries(r.debug).map(([k,v])=>k+':'+(+v).toFixed(2)).join(' ') : 'no face';
    box.append(t); out.append(box);
  }
}
document.title='done';
</script>
