<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c4b6e0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 5 5%22 shape-rendering=%22crispEdges%22%3E%3Cpath fill=%22%23e66b8f%22 d=%22M0 1h5v2H0zM1 0h1v1H1zM3 0h1v1H3zM1 3h3v1H1zM2 4h1v1H2z%22/%3E%3C/svg%3E">
<title>Wedding Guestbook</title>
<link rel="preload" href="fonts/Galmuri11.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<style>
  body.kiosk .only-guest { display: none !important; }
  body:not(.kiosk) .only-kiosk { display: none !important; }
</style>
</head>
<body class="guest">
<main class="app">
  <div class="topbar">
    <a class="admin-link only-guest" id="admin-link" href="admin.html" aria-label="관리자 / Admin" title="관리자 / Admin">🔑</a>
    <span class="step-label" id="step-label"></span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ko">한국어</button>
      <button type="button" data-lang="en">English</button>
    </div>
  </div>

  <!-- 0. welcome -->
  <section class="screen" id="s-welcome">
    <div class="px-box card hero">
      <span class="badge">WEDDING</span>
      <h1 id="hero-names"></h1>
      <div class="date" id="hero-date"></div>
      <canvas id="couple-canvas" class="couple-stage pixel" width="110" height="75"></canvas>
      <p class="sub" data-i18n="welcome_sub"></p>
      <p class="notice" id="already" hidden data-i18n="already"></p>
      <div class="row center only-guest" id="mine-row" hidden>
        <button class="px-btn blue small" id="btn-mysnap" data-i18n="my_snap"></button>
        <a class="px-btn secondary small" id="btn-village" href="village.html" data-i18n="back_village"></a>
      </div>
    </div>
    <div class="slot" id="slot-welcome"></div>
    <div class="start-btns">
      <button class="px-btn big" id="btn-start" data-i18n="start"></button>
      <button class="px-btn secondary big" id="btn-simple">👵 <span data-i18n="simple_start"></span></button>
    </div>
  </section>

  <!-- 1. info -->
  <section class="screen" id="s-info">
    <div class="px-box card" style="display:flex;flex-direction:column;gap:16px">
      <label class="field"><span data-i18n="name"></span>
        <input class="input" id="in-name" maxlength="20" autocomplete="name" enterkeyhint="next" data-i18n-ph="name_ph">
      </label>
      <div class="field" style="display:flex;flex-direction:column;gap:6px;font-weight:700">
        <span data-i18n="side"></span>
        <div class="seg" id="side-seg">
          <button type="button" data-v="groom" aria-pressed="false" data-i18n="side_groom"></button>
          <button type="button" data-v="bride" aria-pressed="false" data-i18n="side_bride"></button>
          <button type="button" data-v="both" aria-pressed="true" data-i18n="side_both"></button>
        </div>
      </div>
      <label class="field"><span data-i18n="message"></span>
        <textarea class="input" id="in-msg" maxlength="200" data-i18n-ph="message_ph"></textarea>
        <span class="counter" id="msg-count">0 / 200</span>
      </label>
      <label class="check priv-check"><input type="checkbox" id="in-priv"><span data-i18n="priv_label"></span></label>
      <div class="voice" id="voice">
        <div class="voice-head"><b data-i18n="voice_title"></b><small class="tip" data-i18n="voice_sub"></small></div>
        <div class="voice-row">
          <button type="button" class="px-btn small" id="v-rec">🎤 <span data-i18n="voice_rec"></span></button>
          <button type="button" class="px-btn small" id="v-stop" hidden>⏹ <span data-i18n="voice_stop"></span></button>
          <button type="button" class="px-btn small blue" id="v-play" hidden>▶ <span data-i18n="voice_play"></span></button>
          <button type="button" class="px-btn small secondary" id="v-del" hidden>🗑</button>
          <div class="v-meter" id="v-meter" hidden><i></i></div>
          <span class="v-time" id="v-time"></span>
        </div>
        <p class="err" id="v-err"></p>
      </div>
      <details class="capsule only-full" id="capsule-box">
        <summary>💌 <span data-i18n="capsule_title"></span></summary>
        <p class="tip" data-i18n="capsule_sub"></p>
        <textarea class="input" id="in-capsule" maxlength="1000" data-i18n-ph="capsule_ph"></textarea>
      </details>
    </div>
    <div class="sticky-foot">
      <p class="tip foot-hint" id="info-hint"></p>
      <div class="foot-row">
        <button class="px-btn secondary" id="info-back" data-i18n="back"></button>
        <button class="px-btn grow" id="info-next" disabled data-i18n="next"></button>
      </div>
    </div>
  </section>

  <!-- 2. photo -->
  <section class="screen" id="s-photo">
    <div class="cam px-box">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="still" class="still" hidden></canvas>
      <canvas id="scan" class="still" hidden></canvas>
      <div class="guide"><div class="guide-text" data-i18n="photo_guide"></div></div>
      <div class="flash"></div>
      <div class="fallback" id="cam-fallback" hidden></div>
    </div>
    <p class="tip" id="photo-tip" data-i18n="photo_tip"></p>
    <div id="analysis" hidden>
      <p class="scan-status" id="scan-status"></p>
      <div class="chips" id="chips"></div>
    </div>
    <div class="row center" id="alt-row">
      <label class="px-btn secondary small" id="btn-upload" tabindex="0"><span data-i18n="upload"></span><input type="file" id="file" accept="image/*" hidden></label>
      <button class="px-btn secondary small" id="btn-skip"></button>
    </div>
    <label class="check"><input type="checkbox" id="keep-photo" checked><span data-i18n="keep_photo"></span></label>
    <div class="sticky-foot">
      <div class="foot-row">
        <button class="px-btn secondary" id="photo-back"></button>
        <button class="px-btn grow" id="btn-capture" disabled>📸 <span data-i18n="capture"></span></button>
        <button class="px-btn secondary" id="btn-retake" hidden data-i18n="retake"></button>
        <button class="px-btn grow" id="btn-use" hidden data-i18n="to_custom"></button>
      </div>
    </div>
  </section>

  <!-- 3. customize -->
  <section class="screen" id="s-custom">
    <div class="preview-wrap px-box">
      <canvas id="preview" class="pixel" width="180" height="250"></canvas>
      <div class="nm"><span class="tag" id="preview-name"></span></div>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="px-box card scroll-area" id="opts"></div>
    <div class="sticky-foot">
      <div class="foot-row">
        <button class="px-btn secondary" id="custom-back" data-i18n="back"></button>
        <button class="px-btn secondary" id="btn-random">🎲</button>
        <button class="px-btn grow" id="btn-to-act" data-i18n="next"></button>
      </div>
    </div>
  </section>

  <!-- 4. activity -->
  <section class="screen" id="s-act">
    <div class="px-box card" style="text-align:center"><h2 style="margin:4px 0" data-i18n="act_title"></h2></div>
    <div class="acts" id="acts"></div>
    <div class="sticky-foot">
      <div class="err" id="submit-err"></div>
      <div class="foot-row">
        <button class="px-btn secondary" id="act-back" data-i18n="back"></button>
        <button class="px-btn grow" id="btn-submit" data-i18n="submit"></button>
      </div>
    </div>
  </section>

  <!-- 5. done -->
  <section class="screen" id="s-done">
    <div class="px-box done-head">
      <div class="done-stage"><canvas id="done-canvas" class="pixel" width="108" height="156"></canvas><div class="bubble-msg" id="done-msg"></div></div>
      <h2 data-i18n="done_title"></h2>
      <p data-i18n="done_sub"></p>
    </div>
    <p class="notice" id="done-queued" hidden data-i18n="done_queued"></p>
    <div class="snapbox px-box only-guest" id="snap-done"></div>
    <div class="remote px-box only-guest" id="remote-done"></div>
    <div class="sticky-foot only-guest">
      <a class="px-btn blue" id="link-village" href="village.html">🏡 <span data-i18n="view_village"></span></a>
    </div>
    <div class="handoff px-box only-kiosk" id="handoff">
      <canvas id="handoff-qr" width="33" height="33"></canvas>
      <div><b data-i18n="handoff_title"></b><p class="tip" data-i18n="handoff_sub"></p></div>
    </div>
    <div class="row center only-kiosk" style="margin-top:auto;flex-direction:column;align-items:center">
      <button class="px-btn" id="btn-again" data-i18n="again"></button>
      <span class="tip" id="reset-count"></span>
    </div>
  </section>
  <!-- remote (returning guests) -->
  <section class="screen" id="s-remote">
    <div class="snapbox px-box" id="snap-solo"></div>
    <div class="remote px-box" id="remote-solo"></div>
    <div class="sticky-foot">
      <div class="foot-row">
        <button class="px-btn secondary" id="remote-home" data-i18n="back"></button>
        <a class="px-btn blue grow" id="link-village2" href="village.html" data-i18n="to_village"></a>
      </div>
    </div>
  </section>
</main>
<div class="overlay-sending" id="sending"><span data-i18n="sending" class="dots"></span></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="js/guest.js"></script>
</body>
</html>
